# The current hour and the next 11 (includes tomorrow once it's published).
type: custom:flex-table-card
title: Upcoming prices
entities:
  include: sensor.YOURHOME_current_price
columns:
  - name: Time
    data: upcoming.start
    modify: >-
      new Date(x).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
  - name: ''
    data: upcoming.now
    modify: "x ? '◀ now' : ''"
  - name: Price (øre)
    data: upcoming.price
    align: right
    modify: (x * 100).toFixed(2)
  - name: Grid (øre)
    data: upcoming.grid
    align: right
    modify: "x === null ? '–' : (x * 100).toFixed(2)"
  - name: Level
    data: upcoming.level
css:
  # Title in the same size as the chart titles; rows without stripes.
  ha-card: '--ha-card-header-font-size: 16px; --ha-card-header-color: var(--secondary-text-color);
    --ha-font-weight-normal: 500; --ha-space-5: 12px; --ha-space-6: 4px'
  'tbody tr:nth-child(odd)': 'background-color: transparent'
  'tbody tr:nth-child(even)': 'background-color: transparent'
  'tbody td': 'border-top: 1px solid var(--divider-color)'
