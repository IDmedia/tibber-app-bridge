# Tile with an arc on top showing load relative to max (like the app's Pulse tile).
#   variables: max_power (W). Defaults to 3 x 230 V x main fuse.
tibber_power_tile:
  template: tibber_tile
  variables:
    label: Pulse
    unit: W
    fuse_entity: null
    max_power: |
      [[[
        const fuse = variables.fuse_entity ? Number(states[variables.fuse_entity]?.state) : 0;
        return fuse ? fuse * 230 * 3 : 20000;
      ]]]
  styles:
    card:
      - overflow: hidden
    custom_fields:
      arc:
        - position: absolute
        - top: 6px
        - left: 50%
        - transform: translateX(-50%)
        - width: 70%
  custom_fields:
    arc: |
      [[[
        const pct = Math.max(0, Math.min(1, Number(entity?.state) / variables.max_power || 0));
        const arc = 'M8 26 Q60 -6 112 26';
        return `<svg viewBox="0 0 120 30" width="100%">
          <path d="${arc}" pathLength="100" fill="none" stroke="var(--tibber-track)"
                stroke-width="5" stroke-linecap="round"/>
          <path d="${arc}" pathLength="100" fill="none" stroke="var(--tibber-teal)"
                stroke-width="5" stroke-linecap="round" stroke-dasharray="${pct * 100} 100"/></svg>`;
      ]]]
