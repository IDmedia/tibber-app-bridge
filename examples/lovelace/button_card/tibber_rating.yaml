# Efficiency ring with percentage and stars, plus description.
tibber_rating:
  template: tibber_base
  styles:
    grid:
      - grid-template-areas: '"ring" "text"'
      - row-gap: 12px
    custom_fields:
      text:
        - color: var(--secondary-text-color)
        - font-size: 14px
        - padding: 0 8px
        - white-space: normal
  custom_fields:
    ring: |
      [[[
        const v = Number(entity?.state);
        const stars = entity?.attributes?.stars || 0;
        const color = isNaN(v) ? 'var(--tibber-track)' : v <= -10 ? 'var(--tibber-teal)' : 'var(--tibber-cyan)';
        const s = [1, 2, 3].map((i) => `<ha-icon icon="mdi:star" style="--mdc-icon-size:15px;color:${
          i <= stars ? 'var(--tibber-cyan)' : 'var(--tibber-track)'}"></ha-icon>`).join('');
        return `<div style="width:112px;height:112px;border-radius:50%;border:9px solid ${color};box-sizing:border-box;
            margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <span style="font-size:20px;font-weight:600">${isNaN(v) ? '–' : (v > 0 ? '+' : '') + variables.fmt(v, 1) + ' %'}</span>
          <div>${s}</div></div>`;
      ]]]
    text: |
      [[[
        const v = Number(entity?.state);
        if (isNaN(v)) return '';
        return v >= 0
          ? `You used ${variables.fmt(v)}% more electricity than the average of similar homes. EV charging is excluded.`
          : `You used ${variables.fmt(-v)}% less electricity than the average of similar homes. EV charging is excluded.`;
      ]]]
