# "Your average price" with comparison columns.
#   entity: average price sensor (attributes low/average/high)
tibber_average_price:
  template: tibber_base
  variables:
    caption: Your average
    home_label: Your home
  styles:
    grid:
      - grid-template-areas: '"caption" "value" "note" "bars"'
      - row-gap: 6px
    custom_fields:
      caption:
        - justify-self: start
        - font-size: 13px
        - letter-spacing: 1px
        - text-transform: uppercase
        - color: var(--secondary-text-color)
      value:
        - justify-self: start
      note:
        - justify-self: start
        - color: var(--secondary-text-color)
        - font-size: 14px
      bars:
        - justify-self: stretch
        - padding-top: 16px
  custom_fields:
    caption: '[[[ return variables.caption ]]]'
    value: |
      [[[
        const u = variables.money_unit(entity?.attributes?.unit_of_measurement);
        return `<span style="font-size:56px;font-weight:800;line-height:1">${variables.fmt(entity?.state, 2)}</span>`
          + `<span style="font-size:18px;font-weight:600"> ${u}/kWh</span>`;
      ]]]
    note: Incl. taxes, fees and Grid Rewards. Excl. electricity subsidy.
    bars: |
      [[[
        const a = entity?.attributes || {};
        const rows = [
          ['Low', a.low, false], ['Average', a.average, false], ['High', a.high, false],
          [variables.home_label, Number(entity?.state), true],
        ].filter((r) => r[1] !== null && r[1] !== undefined && !isNaN(r[1])).sort((x, y) => x[1] - y[1]);
        if (!rows.length) return '';
        const lo = Math.min(...rows.map((r) => r[1])), hi = Math.max(...rows.map((r) => r[1]));
        const h = (v) => 40 + (hi === lo ? 60 : (v - lo) / (hi - lo) * 60);
        return `<div style="display:flex;gap:10px;align-items:flex-end;height:180px">${rows.map(([l, v, mine]) => `
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
            <span style="font-weight:700;color:${mine ? 'var(--primary-text-color)' : 'var(--secondary-text-color)'}">${variables.fmt(v, 2)}</span>
            <div style="width:100%;height:${h(v)}%;margin-top:6px;border-radius:16px 16px 0 0;
                 background:${mine ? 'var(--tibber-cyan)' : 'var(--tibber-track)'}"></div>
            <span style="margin-top:6px;font-size:13px;${mine ? 'font-weight:600' : 'color:var(--secondary-text-color)'}">${l}</span>
          </div>`).join('')}</div>`;
      ]]]
